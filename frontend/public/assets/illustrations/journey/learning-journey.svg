<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 200" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- learning-journey.svg — Learn → Practice → Build → Assess → Certify → Portfolio → Employment -->

  <!-- pathway -->
  <path d="M70 100 h960" stroke="#94a3b8" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="2 12"/>
  <path d="M1020 94 l16 6 -16 6 z" fill="#2563eb"/>

  <!-- nodes: book, wrench, cube, check, shield, folder, briefcase -->
  <g stroke-width="2">
    <!-- 1 Learn -->
    <g>
      <circle cx="70" cy="100" r="30" fill="rgba(255,255,255,0.6)" stroke="#2563eb" stroke-width="3"/>
      <path d="M70 88 h14 a4 4 0 0 1 4 4 v14 a4 4 0 0 0 -4 -4 h-14 z" fill="#2563eb"/>
      <path d="M70 88 h-14 a4 4 0 0 0 -4 4 v14 a4 4 0 0 1 4 -4 h14 z" fill="#2563eb"/>
    </g>
    <!-- 2 Practice -->
    <g>
      <circle cx="225" cy="100" r="30" fill="rgba(255,255,255,0.6)" stroke="#2563eb" stroke-width="3"/>
      <path d="M225 84 a14 14 0 0 0 -7 26 v8 h14 v-8 a14 14 0 0 0 -7 -26 z" stroke="#2563eb" stroke-width="2"/>
      <path d="M218 96 h14" stroke="#2563eb" stroke-width="2"/>
    </g>
    <!-- 3 Build -->
    <g>
      <circle cx="380" cy="100" r="30" fill="rgba(255,255,255,0.6)" stroke="#2563eb" stroke-width="3"/>
      <rect x="368" y="94" width="24" height="12" rx="3" stroke="#2563eb" stroke-width="2"/>
      <rect x="368" y="112" width="12" height="6" rx="2" stroke="#2563eb" stroke-width="2"/>
      <rect x="386" y="112" width="12" height="6" rx="2" stroke="#2563eb" stroke-width="2"/>
    </g>
    <!-- 4 Assess -->
    <g>
      <circle cx="535" cy="100" r="30" fill="rgba(255,255,255,0.6)" stroke="#2563eb" stroke-width="3"/>
      <rect x="522" y="88" width="26" height="24" rx="5" stroke="#2563eb" stroke-width="2"/>
      <path d="M528 100 l5 5 9 -11" stroke="#2563eb" stroke-width="2.5"/>
    </g>
    <!-- 5 Certify -->
    <g>
      <circle cx="690" cy="100" r="30" fill="rgba(255,255,255,0.6)" stroke="#6d28d9" stroke-width="3"/>
      <path d="M690 82 l16 6.5 v10 c0 10 -7 18 -16 23 c-9 -5 -16 -13 -16 -23 v-10 z" stroke="#6d28d9" stroke-width="2"/>
      <path d="M684 100 l4.5 4.5 9 -11" stroke="#6d28d9" stroke-width="2.5"/>
    </g>
    <!-- 6 Portfolio -->
    <g>
      <circle cx="845" cy="100" r="30" fill="rgba(255,255,255,0.6)" stroke="#6d28d9" stroke-width="3"/>
      <path d="M838 92 h8 l4 -6 h12 a4 4 0 0 1 4 4 v4 h-32 z" stroke="#6d28d9" stroke-width="2"/>
      <path d="M836 96 a4 4 0 0 1 4 -4 h6 l4 -6 h10 a4 4 0 0 1 4 4 v4 h-32 z" stroke="#6d28d9" stroke-width="2" stroke-opacity="0.4"/>
      <path d="M838 104 h20" stroke="#6d28d9" stroke-width="2"/>
    </g>
    <!-- 7 Employment -->
    <g>
      <circle cx="1000" cy="100" r="30" fill="rgba(255,255,255,0.6)" stroke="#16a34a" stroke-width="3"/>
      <rect x="982" y="96" width="36" height="14" rx="3" stroke="#16a34a" stroke-width="2"/>
      <path d="M990 96 v-4 a3 3 0 0 1 3 -3 h6 a3 3 0 0 1 3 3 v4" stroke="#16a34a" stroke-width="2"/>
      <circle cx="1000" cy="103" r="2" fill="#16a34a"/>
    </g>
  </g>
</svg>
